# One-click deploy of the voice server from a connected repo.
#
# The console stays on Vercel; only this needs a host that keeps a socket open.
services:
  - type: web
    name: vaani-voice-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set in the dashboard; never committed
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_LIVE_VOICE
        value: Leda
      # Browser origins allowed to open a call. Without this the server answers
      # loopback only, which is correct for local development and useless here.
      - key: VAANI_ALLOWED_ORIGINS
        sync: false
